<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Two validation gates</title>
  <desc id="d">A feature commissioned by an institution is co-designed with the product owner, the architects and the client, approved by the institution, built by the development team, then reviewed by the geOrchestra community before it joins the shared code base. Each review can send the work back for changes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B3A42"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8890"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; fill: #2B3A42; }
    .stage { font-size: 19px; font-weight: 600; }
    .body { font-size: 15px; fill: #5A6870; }
    .gate { font-size: 19px; font-weight: 700; fill: #1D5C63; }
    .gate-sub { font-size: 15px; fill: #1D5C63; }
    .loop { font-size: 14px; fill: #7A8890; font-style: italic; }
  </style>

  <rect width="1200" height="460" fill="#FFFFFF"/>

  <!-- main path -->
  <line x1="60" y1="260" x2="1140" y2="260" stroke="#2B3A42" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- gates -->
  <rect x="463" y="140" width="14" height="150" rx="2" fill="#1D5C63"/>
  <rect x="813" y="140" width="14" height="150" rx="2" fill="#1D5C63"/>
  <text class="gate" x="470" y="92" text-anchor="middle">Client validation</text>
  <text class="gate-sub" x="470" y="114" text-anchor="middle">The institution approves the design</text>
  <text class="gate" x="820" y="92" text-anchor="middle">Community review</text>
  <text class="gate-sub" x="820" y="114" text-anchor="middle">The pull request is reviewed before merge</text>

  <!-- return loops -->
  <path d="M459,180 C390,180 250,180 216,224" fill="none" stroke="#7A8890" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text class="loop" x="330" y="168" text-anchor="middle">Changes requested</text>
  <path d="M809,180 C740,180 600,180 566,224" fill="none" stroke="#7A8890" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text class="loop" x="680" y="168" text-anchor="middle">Changes requested</text>

  <!-- stage nodes -->
  <g fill="#FFFFFF" stroke="#2B3A42" stroke-width="2">
    <circle cx="70" cy="260" r="7"/>
    <circle cx="210" cy="260" r="7"/>
    <circle cx="560" cy="260" r="7"/>
  </g>
  <circle cx="920" cy="260" r="9" fill="#2B3A42"/>

  <!-- stage labels -->
  <text class="stage" x="62" y="325">Brief</text>
  <text class="body" x="62" y="350">An institution</text>
  <text class="body" x="62" y="370">asks for</text>
  <text class="body" x="62" y="390">a feature</text>

  <text class="stage" x="202" y="325">Co-design</text>
  <text class="body" x="202" y="350">With the product owner,</text>
  <text class="body" x="202" y="370">the architects and the client,</text>
  <text class="body" x="202" y="390">balancing the request, the</text>
  <text class="body" x="202" y="410">budget and the technical latitude</text>

  <text class="stage" x="552" y="325">Development</text>
  <text class="body" x="552" y="350">Built by the</text>
  <text class="body" x="552" y="370">development team</text>

  <text class="stage" x="910" y="325">Shared code base</text>
  <text class="body" x="910" y="350">Available to every</text>
  <text class="body" x="910" y="370">deployment built on it</text>
</svg>
