<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d">
  <title id="t">Five applications, one library</title>
  <desc id="d">A matrix of the shared design library against the five applications. The time scrubber, the source line, point reading and definitions, and the generic base of buttons, fields, lists and dialogs serve all five. The nature-of-data label, the colour legend and map drawing serve the four map and mobile applications. The side panel and the top bar serve the four web applications. The mobile bottom sheet serves four. The computation status on EDITO serves the three map applications, the verdict with its uncertainty two, and the depth cursor only Virtual Ocean.</desc>
