    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; fill: #2B3A42; }
    .h { font-size: 16px; font-weight: 600; }
    .sub { font-size: 13px; fill: #5A6870; }
    .lab { font-size: 15px; }
    .num { font-size: 15px; font-weight: 600; fill: #5A6870; }
    .note { font-size: 13px; fill: #5A6870; }
    .in-dark { font-size: 19px; font-weight: 700; fill: #FFFFFF; }
    .in-light { font-size: 19px; font-weight: 700; fill: #2B3A42; }
  </style>
