<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 432" width="1200" height="432" role="img" aria-labelledby="t d">
  <title id="t">Where each feature comes from</title>
  <desc id="d">Stacked bars of the feature catalogues of four applications, by origin. Iceberg Navigation: 77 features, 20 owed under the specification, 27 committed in the offer, 27 proposed by the framing, 3 additions. Fish Stock: 76 features, 20 owed, 19 committed, 34 proposed, 3 additions. Protected Areas: 68 features, 22 owed, 14 committed, 29 proposed, 3 additions. MyOcean Mobile: 84 features, 39 owed, 16 committed, 27 proposed, 2 additions. Between a quarter and a half of each catalogue is owed.</desc>
