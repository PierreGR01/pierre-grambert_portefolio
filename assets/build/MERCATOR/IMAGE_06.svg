<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
  <title id="t">Two scales for one water column</title>
  <desc id="d">The same water column drawn two ways, from 50 m above the surface to a seabed at 4,120 m. On one linear scale, the first 200 m take 5 % of the height, and 26 of the model's 50 depth levels and four key depths are crushed into a few pixels. On the three tiers of the design, 0 to 200 m, 200 to 1,000 m and 1,000 m to the seabed, following the sunlit and twilight zones, the first 200 m take 55 % of the height and the key depths separate: mixed layer 20 m, thermocline 45 m, chlorophyll maximum 62 m, euphotic zone 150 m, oxygen minimum 400 to 800 m. Each change of tier is a dotted line across the column.</desc>
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; fill: #2B3A42; }
    .h { font-size: 16px; font-weight: 600; }
    .sub { font-size: 13px; fill: #5A6870; }
    .lab { font-size: 15px; }
    .num { font-size: 15px; font-weight: 600; fill: #5A6870; }
    .note { font-size: 13px; fill: #5A6870; }
    .in-dark { font-size: 19px; font-weight: 700; fill: #FFFFFF; }
    .in-light { font-size: 19px; font-weight: 700; fill: #2B3A42; }
  </style>
