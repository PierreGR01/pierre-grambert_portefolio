<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d">
  <title id="t">One time scrubber, three settings</title>
  <desc id="d">Three settings of the same time scrubber. Virtual Ocean: an hourly analysis up to now, then a 10-day forecast. Arctic Iceberg Navigation Risk: hours over three days, with the ship's passage from departure to arrival drawn under the scrubber and tinted by collision probability, and a marker where the route closes. Fish Stock Spatial Management: yearly steps, a hindcast from 2000 then a projection to 2050, with closures in force from 2026.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8890"/>
    </marker>
    <linearGradient id="risk" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F7E3C8"/>
      <stop offset="0.45" stop-color="#EDB277"/>
      <stop offset="0.62" stop-color="#C2602E"/>
      <stop offset="0.72" stop-color="#EDB277"/>
      <stop offset="1" stop-color="#F7E3C8"/>
    </linearGradient>
  </defs>
